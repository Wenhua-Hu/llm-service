# Project 2 CPU diagnostics. No platform/cloud secrets. Never use self-hosted runners.
name: Project 2 CPU interfaces
run-name: Project 2 soft · ${{ inputs.commit_sha || github.sha }} · ${{ inputs.request_id || github.run_id }}
on:
  push:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character pushed commit SHA to check
        required: true
        type: string
      request_id:
        description: Optional unique correlation ID from the evaluate plugin
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: llm-soft-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOFT_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Validate immutable revision
        shell: bash
        run: |
          [[ "$SOFT_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOFT_COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download and verify public CPU checker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, urllib.request
          root = Path(os.environ['RUNNER_TEMP']) / 'llm-soft-tools'
          root.mkdir(exist_ok=False)
          pins = {'soft_runner.py': 'ed9f4f45e2e5cba23bf4c67d58be9ce10e69576e8bdd36904c442788354676cb', 'soft_check.py': '43878383b810358a5dbd8a796c94acd3f6cb39fc8665929a2d5354f079eb65db', 'credential_fixture.py': 'ef860b68237f946d2394f00e48eb2f8d3c17bded84861542232cefbeed66d19c'}
          base = 'https://agentist.org/lab/llm-lab/soft/'
          for name, digest in pins.items():
              url = base + name
              with urllib.request.urlopen(url, timeout=30) as response:
                  assert response.status == 200 and response.geturl() == url, 'unexpected download redirect'
                  data = response.read(300001)
              assert len(data) <= 300000 and hashlib.sha256(data).hexdigest() == digest, 'checker hash mismatch; refresh workflow from taskbook'
              (root / name).write_bytes(data)
          PY
          python3 -m venv "$RUNNER_TEMP/llm-soft-python"
          "$RUNNER_TEMP/llm-soft-python/bin/pip" install --disable-pip-version-check httpx==0.28.1
      - name: Run CPU interface checks
        shell: bash
        run: |
          "$RUNNER_TEMP/llm-soft-python/bin/python" "$RUNNER_TEMP/llm-soft-tools/soft_runner.py" --submission "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/llm-soft-output"
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llm-soft-report
          path: |
            ${{ runner.temp }}/llm-soft-output/report.json
            ${{ runner.temp }}/llm-soft-output/summary.md
          if-no-files-found: warn
          retention-days: 14
